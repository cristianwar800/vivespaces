# PersistentVolumeClaim para MySQL
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vivespaces-mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
# Deployment de MySQL OPTIMIZADO Y BALANCEADO
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vivespaces-mysql
  labels:
    app: vivespaces-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vivespaces-mysql
  template:
    metadata:
      labels:
        app: vivespaces-mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: ""
        - name: MYSQL_ALLOW_EMPTY_PASSWORD
          value: "yes"
        - name: MYSQL_DATABASE
          value: "vivespaces"
        - name: MYSQL_TCP_PORT
          value: "3307"
        args:
          - "--default-authentication-plugin=mysql_native_password"
          - "--character-set-server=utf8mb4"
          - "--collation-server=utf8mb4_unicode_ci"
          - "--max_connections=150"
          - "--innodb_buffer_pool_size=256M"
          - "--innodb_flush_log_at_trx_commit=2"
          - "--skip-name-resolve"
          - "--performance_schema=OFF"
          - "--tmp_table_size=32M"
          - "--max_heap_table_size=32M"
        ports:
        - containerPort: 3307
          name: mysql
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: vivespaces-mysql-pvc

---
# Service de MySQL con puerto 3307
apiVersion: v1
kind: Service
metadata:
  name: vivespaces-mysql
  labels:
    app: vivespaces-mysql
spec:
  type: LoadBalancer
  selector:
    app: vivespaces-mysql
  ports:
  - port: 3307
    targetPort: 3307
    name: mysql